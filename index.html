<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>九九ダンジョン</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap">
<style>
:root{
  --bg:#000; --ink:#fff; --dim:#9aa0b8; --gold:#ffd23f; --red:#ff5a4a; --green:#6fd66a;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
/* レトロRPGの画面なので、明るいテーマでも暗いテーマでも同じ配色にする */
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#000; --ink:#fff; } }
:root[data-theme="dark"]{ --bg:#000; --ink:#fff; }
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{
  height:100%;margin:0;background:var(--bg);color:var(--ink);overflow:hidden;
  font-family:"DotGothic16","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",Meiryo,monospace;
  font-size:18px;line-height:1.5;-webkit-tap-highlight-color:transparent;
}
button,input{font:inherit;color:inherit;background:var(--bg)}
button{cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.app{height:100%;max-width:520px;margin:0 auto;padding:10px 12px 12px;display:flex;flex-direction:column}
.screen{display:none;flex:1;min-height:0;flex-direction:column;gap:10px}
.screen.on{display:flex}
.scroll{overflow-y:auto}
.win{background:var(--bg);border:3px solid var(--ink);border-radius:8px;padding:10px 12px}
.cmd{border:3px solid var(--ink);border-radius:8px;padding:10px 8px;text-align:left}
.cmd:active{background:var(--ink);color:var(--bg)}
.cmd:disabled{border-color:var(--dim);color:var(--dim);cursor:default}
.wide{display:block;width:100%;margin-bottom:6px}
.small{font-size:15px;color:var(--dim)}
.gold{color:var(--gold)}
.red{color:var(--red)}
.grow{flex:1;min-height:0}
.pre{white-space:pre-line}

/* タイトル */
h1{margin:6px 0 4px;text-align:center;font-weight:400;font-size:clamp(34px,11vw,52px);letter-spacing:.08em;color:var(--gold);text-shadow:3px 3px 0 #8a4b00}
.center{text-align:center}
.slot{display:flex;gap:8px;margin-top:8px}
.slot .cmd{flex:1}
.slot .del{border:3px solid var(--dim);color:var(--dim);border-radius:8px;padding:0 10px;font-size:15px}
.name{width:100%;border:3px solid var(--ink);border-radius:8px;padding:10px;margin:8px 0;font-size:24px}

/* きょてん */
.hero{display:flex;gap:12px;align-items:center}
.hero svg{height:72px;flex:none}
.pick{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.pk{border:2px solid var(--dim);border-radius:6px;padding:6px 2px;text-align:center;font-size:12px;line-height:1.25;min-width:0}
.pk svg{height:46px;display:block;margin:0 auto 3px}
.pk.on{border:3px solid var(--gold);color:var(--gold)}
.pk:disabled{color:var(--dim);cursor:default}
.pk:disabled svg{filter:brightness(.2)}
.swatches{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.swb{aspect-ratio:1;border:3px solid var(--dim);border-radius:8px;min-width:0}
.swb.on{border-color:#fff;box-shadow:0 0 0 3px var(--gold)}
select.name{font-size:18px;margin:4px 0 6px}
.card{border:2px solid var(--dim);border-radius:6px;padding:8px;margin-bottom:8px}
.code{width:100%;border:2px solid var(--dim);border-radius:6px;padding:8px;font-size:16px;letter-spacing:.05em;margin:6px 0}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.fl{border:3px solid var(--ink);border-radius:8px;padding:6px 2px 8px;text-align:center;line-height:1.3}
.fl svg{height:44px;display:block;margin:0 auto 2px}
.fl:active{background:#222}
.fl.done,.cmd.done{border-color:var(--gold)}
.status{display:flex;justify-content:space-between;gap:4px 8px;flex-wrap:wrap}
.bar{display:flex;gap:8px}
.bar .cmd{flex:1;text-align:center;padding:8px 4px}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.menu .cmd{text-align:center;padding:8px 4px}

/* そうび・ずかん・リスト */
.list{display:flex;flex-direction:column;gap:6px;margin:0 0 10px}
.item{display:flex;justify-content:space-between;gap:8px;border:2px solid var(--dim);border-radius:6px;padding:6px 8px;text-align:left}
.item.on{border-color:var(--gold);color:var(--gold)}
.sw{display:inline-block;width:.75em;height:.75em;margin-right:.35em;border:1px solid var(--ink)}
.zgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.zt{border:2px solid var(--dim);border-radius:6px;padding:6px 2px;text-align:center;font-size:13px;line-height:1.3;min-width:0}
.zt.got{border-color:var(--ink)}
.zt svg{height:40px;display:block;margin:0 auto 2px}
.row{border-bottom:1px solid #333;padding:6px 0}
h2{font-size:18px;font-weight:400;margin:12px 0 4px;color:var(--gold)}

/* たたかい */
.arena{
  --brick:#2b2540; --brick2:#1c1830; --floor:#141020;
  flex:1 1 0;min-height:34vh;border:3px solid var(--ink);border-radius:8px;position:relative;overflow:hidden;
  display:flex;align-items:flex-end;justify-content:center;padding-bottom:6%;
  background:
    linear-gradient(transparent 0 78%,var(--floor) 78%),
    repeating-linear-gradient(0deg,transparent 0 22px,#000 22px 24px),
    repeating-linear-gradient(90deg,var(--brick) 0 46px,var(--brick2) 46px 48px);
}
.arena .where{position:absolute;top:6px;left:10px;font-size:15px;color:var(--dim);z-index:1}
.arena .mhp{position:absolute;top:30px;right:10px;display:flex;gap:4px;z-index:1}
.mhp i{width:13px;height:13px;background:var(--red);border:2px solid var(--ink)}
.mhp i.gone{background:transparent;border-color:var(--dim)}
#mon{display:flex;align-items:flex-end;justify-content:center;width:100%;height:100%;animation:bob 1.8s ease-in-out infinite}
#mon svg{max-width:96%;transform-origin:50% 100%}
#battle{overflow-y:auto;gap:8px}
.acts{position:absolute;right:6px;bottom:6px;display:flex;gap:6px;z-index:3}
.acts .cmd{padding:3px 8px;font-size:14px;border-width:2px;background:rgba(0,0,0,.72);color:#fff}
.acts .cmd:disabled{color:var(--dim)}
#warn{position:absolute;left:0;right:0;top:38%;text-align:center;font-size:44px;color:var(--red);text-shadow:3px 3px 0 #000,-3px -3px 0 #000,3px -3px 0 #000,-3px 3px 0 #000;z-index:2;pointer-events:none;display:none}
#warn.on{display:block;animation:warn 1.1s both}
.hpbar i.low{animation:pulse .7s steps(2) infinite}
#mon.boss svg{filter:drop-shadow(0 0 10px #ff3030)}
#mon.rare svg{filter:drop-shadow(0 0 10px #ffe066) brightness(1.35) saturate(1.6)}
#pal{position:absolute;left:8px;bottom:4px;height:24%}
#pal svg{height:100%}
#pal.used{opacity:.3}
.msg{height:6.2em;overflow-y:auto;white-space:pre-line;font-size:16px;line-height:1.4;padding:8px 12px}
.q{text-align:center;font-size:clamp(32px,10vw,46px);line-height:1.2;letter-spacing:.04em;padding:4px 8px}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.answers.pad{grid-template-columns:repeat(4,1fr);gap:6px}
.ans{border:3px solid var(--ink);border-radius:8px;padding:7px 0;font-size:clamp(26px,8vw,36px);line-height:1.2}
.pad .ans{padding:6px 0;font-size:24px}
.ans:active{background:var(--ink);color:var(--bg)}
.ans.right{background:var(--green);color:#000;border-color:var(--green)}
.ans.wrong{color:var(--dim);border-color:var(--dim)}
.ans:disabled{cursor:default}
.next{display:none;text-align:center;border-color:var(--gold);color:var(--gold)}
.next.show{display:block}

/* HPバー・コンボ・こうげきエフェクト・にゅうしゅ まど */
.hpbar{flex-basis:100%;height:16px;border:2px solid var(--ink);border-radius:4px;background:#222;overflow:hidden}
.hpbar i{display:block;height:100%;width:100%;background:var(--green);transition:width .35s}
.hpbar i.mid{background:var(--gold)}
.hpbar i.low{background:var(--red)}
#combo{position:absolute;left:10px;top:30px;z-index:1;color:var(--gold);line-height:1.15;text-shadow:2px 2px 0 #000}
#combo b{font-weight:400;font-size:34px}
#combo.bump{animation:bump .3s}
#fx{position:absolute;inset:0;pointer-events:none;z-index:2}
#fx .spark{position:absolute;left:50%;top:50%;height:78%;aspect-ratio:1;transform:translate(-50%,-50%);animation:spark .36s both}
#fx .white{position:absolute;inset:0;background:#fff;animation:wflash .22s both}
.dmg{position:absolute;left:50%;top:30%;transform:translateX(-50%);white-space:nowrap;font-size:60px;line-height:1;color:#fff;text-shadow:3px 3px 0 #000,-3px -3px 0 #000,3px -3px 0 #000,-3px 3px 0 #000,0 5px 0 #000;animation:rise 1s .18s both}
.dmg.crit{color:var(--gold);font-size:78px}
.dmg.hurt,.dmg.guard{animation-delay:0s}
.dmg.hurt{color:var(--red);top:52%}
.dmg.guard{color:#7fd0ff;top:56%;font-size:34px}
#flash{position:fixed;inset:0;background:#ff2a2a;opacity:0;pointer-events:none;z-index:5}
#flash.on{animation:flash .35s}
.pop{position:fixed;inset:0;z-index:10;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.8);padding:20px}
.pop.show{display:flex}
.popwin{width:100%;max-width:340px;text-align:center;border-color:var(--gold);animation:bump .3s}
.popwin svg{height:72px;display:block;margin:10px auto}
.popwin .nm{font-size:24px;margin:4px 0}
.popwin .cmd{display:block;width:100%;margin-top:12px;text-align:center;border-color:var(--gold);color:var(--gold)}
/* ゲームオーバー */
.over{background:#000;flex-direction:column;gap:12px;text-align:center;overflow-y:auto;animation:fadein 1.2s both}
.over .go{font-size:clamp(40px,13vw,64px);line-height:1.2;color:var(--red);letter-spacing:.08em;text-shadow:3px 3px 0 #5a0000;animation:godrop 1.1s .3s both}
.over svg{height:64px;transform:rotate(90deg);filter:grayscale(1) brightness(.7);margin:4px auto}
.over .cmd{width:100%;max-width:340px;text-align:center}
.over .again{border-color:var(--gold);color:var(--gold)}
.over .miss{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:340px}
.over .miss span{border:2px solid var(--dim);border-radius:6px;padding:2px 8px}
.over .late{animation:fadein .6s 1.5s both}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes godrop{0%{transform:translateY(-60px) scale(1.3);opacity:0}60%{transform:translateY(6px) scale(1);opacity:1}100%{transform:translateY(0)}}
@keyframes bump{0%{transform:scale(.6)}60%{transform:scale(1.2)}100%{transform:scale(1)}}
@keyframes spark{0%{transform:translate(-50%,-50%) scale(.2) rotate(0);opacity:1}60%{opacity:1}100%{transform:translate(-50%,-50%) scale(1.5) rotate(25deg);opacity:0}}
@keyframes rise{0%{transform:translate(-50%,24px) scale(.3);opacity:0}18%{transform:translate(-50%,-10px) scale(1.35);opacity:1}32%{transform:translate(-50%,0) scale(1)}75%{transform:translate(-50%,0) scale(1);opacity:1}100%{transform:translate(-50%,-30px) scale(1);opacity:0}}
@keyframes shakeHit{0%{transform:translate(0);filter:brightness(5) saturate(0)}12%{transform:translate(-18px,5px) rotate(-6deg);filter:brightness(5) saturate(0)}26%{transform:translate(16px,-4px) rotate(5deg);filter:brightness(1.4)}40%{transform:translate(-13px,3px) rotate(-4deg)}54%{transform:translate(10px,-2px) rotate(3deg)}68%{transform:translate(-7px,0) rotate(-2deg)}84%{transform:translate(4px,0)}100%{transform:translate(0)}}
@keyframes flash{0%{opacity:0}30%{opacity:.4}100%{opacity:0}}
@keyframes blink{0%,40%,80%{opacity:0}20%,60%,100%{opacity:1}}
@keyframes fade{to{opacity:0;transform:translateY(10px)}}
@keyframes quake{0%,100%{transform:translate(0)}25%{transform:translate(-6px,3px)}50%{transform:translate(6px,-3px)}75%{transform:translate(-4px,2px)}}
.is-hit svg{animation:shakeHit .6s both}
.is-down svg{animation:fade .7s forwards}
.is-in svg{animation:appear .5s both}
.is-atk svg{animation:lunge .5s both}
.app.critq{animation:quake .3s}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes appear{0%{transform:scale(.2);filter:brightness(0);opacity:0}60%{transform:scale(1.12);filter:brightness(0);opacity:1}100%{transform:scale(1)}}
@keyframes lunge{0%{transform:scale(1)}18%{transform:scale(.9) translateY(-6%)}45%{transform:scale(1.45) translateY(10%)}60%{transform:scale(1.4) translateY(8%)}100%{transform:scale(1)}}
@keyframes wflash{0%{opacity:.55}100%{opacity:0}}
@keyframes warn{0%{transform:scale(2.2);opacity:0}15%{transform:scale(1);opacity:1}30%,60%{opacity:.3}45%,80%{opacity:1}100%{opacity:0}}
@keyframes pulse{50%{opacity:.45}}
.quake{animation:quake .3s}
@media (prefers-reduced-motion: reduce){#mon,.is-hit svg,.is-in svg,.is-atk svg,.quake,#combo.bump,#fx .spark,#fx .white,.dmg,.dmg.hurt,.over,.over .go,.over .late,#flash.on,.popwin,.app.critq,.hpbar i.low,#warn.on{animation:none}#fx .spark,#fx .white{display:none}.is-down svg{animation:none;opacity:.15}}
</style>
</head>
<body>
<div class="app" id="app">

  <section id="title" class="screen scroll on">
    <h1>九九ダンジョン</h1>
    <p class="center small" style="margin:0 0 8px">九九の ちからで まものを たおせ！</p>
    <div class="win">
      <div>ぼうけんの きろくを えらんでね</div>
      <div id="slots"></div>
    </div>
    <div class="bar"><button class="cmd" id="bgmBtn"></button><button class="cmd" id="sound"></button></div>
    <div class="bar"><button class="cmd small" id="teacher">せんせいよう（きろくの まとめ）</button></div>
  </section>

  <section id="floors" class="screen scroll">
    <div class="win">
      <div class="hero"><span id="heroPic"></span><div><div id="st1"></div><div id="st2" class="gold"></div><div id="st3" class="small"></div></div></div>
      <div id="news" class="gold"></div>
    </div>
    <div class="win">
      <div style="margin-bottom:8px">どの かいそうに もぐる？</div>
      <div class="grid" id="grid"></div>
      <div id="special" style="margin-top:10px"></div>
    </div>
    <div class="menu">
      <button class="cmd" id="toEquip">そうび・なかま</button><button class="cmd" id="toShop">おみせ</button>
      <button class="cmd" id="toZukan">まものずかん</button><button class="cmd" id="toTitles">しょうごう</button>
      <button class="cmd" id="toWeak">にがてリスト</button><button class="cmd" id="toCfg">せってい</button>
      <button class="cmd" id="toProf">プロフィール</button><button class="cmd" id="toFriends">フレンド</button>
    </div>
    <div class="bar"><button class="cmd small" id="toTitle">きろくを えらびなおす</button></div>
  </section>

  <section id="equip" class="screen">
    <div class="win"><div class="hero"><span id="eqPic"></span><div><div id="eqStats" class="pre"></div><div class="small" id="eqCount"></div></div></div></div>
    <div class="win grow scroll"><div id="eqBody"></div></div>
    <div class="bar"><button class="cmd" id="eqBest">いちばん つよい そうび</button><button class="cmd" id="eqBack">もどる</button></div>
  </section>

  <section id="zukan" class="screen">
    <div class="win status"><span>まものずかん</span><span class="gold" id="zCount"></span></div>
    <div class="win grow scroll"><div class="zgrid" id="zgrid"></div></div>
    <div class="bar"><button class="cmd" id="zBack">もどる</button></div>
  </section>

  <section id="page" class="screen">
    <div class="win status"><span id="pgTitle"></span><span class="gold" id="pgSide"></span></div>
    <div class="win grow scroll" id="pgBody"></div>
    <div class="bar"><button class="cmd" id="pgBack">もどる</button></div>
  </section>

  <section id="battle" class="screen">
    <div class="win status"><span id="bs1"></span><span id="bs2"></span><div class="hpbar" id="hpbar" role="img"><i id="hpfill"></i></div></div>
    <div class="arena" id="arena">
      <span class="where" id="where"></span>
      <div class="mhp" id="mhp"></div>
      <div id="mon"></div>
      <div id="pal"></div>
      <div id="combo" aria-live="polite"></div>
      <div id="fx"></div>
      <div id="warn">ボス しゅつげん！</div>
      <div class="acts"><button class="cmd" id="herb"></button><button class="cmd" id="run">にげる</button></div>
    </div>
    <div class="win msg" id="msg" aria-live="polite"></div>
    <div class="win q" id="q"></div>
    <div class="answers" id="answers"></div>
    <button class="cmd next" id="next">▶ つぎへ</button>
    <div class="pop" id="pop" role="dialog" aria-modal="true" aria-labelledby="popHead"><div class="win popwin">
      <div class="gold" id="popHead"></div><div id="popIcon"></div><div class="nm" id="popName"></div><div class="small pre" id="popSub"></div>
      <button class="cmd" id="popOk">▶ OK</button>
    </div></div>
    <div class="pop over" id="over" role="dialog" aria-modal="true" aria-labelledby="goHead">
      <div class="go" id="goHead">ゲームオーバー</div>
      <div id="overPic"></div>
      <div class="pre late" id="overMsg"></div>
      <div class="late" id="overMiss"></div>
      <button class="cmd again late" id="overRetry">▶ もういちど ちょうせんする</button>
      <button class="cmd late" id="overBack">▶ もどる</button>
    </div>
    <div id="flash"></div>
  </section>

</div>
<script>
(function(){
  var $=function(id){return document.getElementById(id)};
  var rnd=function(n){return Math.floor(Math.random()*n)};
  var shuffle=function(a){for(var i=a.length-1;i>0;i--){var j=rnd(i+1),t=a[i];a[i]=a[j];a[j]=t}return a};
  var esc=function(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
  var count=function(o){return Object.keys(o).length};

  /* ---- 九九の よみ ---- */
  var Y=[
   ['いんいちが いち','いんにが に','いんさんが さん','いんしが し','いんごが ご','いんろくが ろく','いんしちが しち','いんはちが はち','いんくが く'],
   ['にいちが に','ににんが し','にさんが ろく','にしが はち','にご じゅう','にろく じゅうに','にしち じゅうし','にはち じゅうろく','にく じゅうはち'],
   ['さんいちが さん','さんにが ろく','さざんが く','さんし じゅうに','さんご じゅうご','さぶろく じゅうはち','さんしち にじゅういち','さんぱ にじゅうし','さんく にじゅうしち'],
   ['しいちが し','しにが はち','しさん じゅうに','しし じゅうろく','しご にじゅう','しろく にじゅうし','ししち にじゅうはち','しは さんじゅうに','しく さんじゅうろく'],
   ['ごいちが ご','ごに じゅう','ごさん じゅうご','ごし にじゅう','ごご にじゅうご','ごろく さんじゅう','ごしち さんじゅうご','ごは しじゅう','ごっく しじゅうご'],
   ['ろくいちが ろく','ろくに じゅうに','ろくさん じゅうはち','ろくし にじゅうし','ろくご さんじゅう','ろくろく さんじゅうろく','ろくしち しじゅうに','ろくは しじゅうはち','ろっく ごじゅうし'],
   ['しちいちが しち','しちに じゅうし','しちさん にじゅういち','しちし にじゅうはち','しちご さんじゅうご','しちろく しじゅうに','しちしち しじゅうく','しちは ごじゅうろく','しちく ろくじゅうさん'],
   ['はちいちが はち','はちに じゅうろく','はちさん にじゅうし','はちし さんじゅうに','はちご しじゅう','はちろく しじゅうはち','はちしち ごじゅうろく','はっぱ ろくじゅうし','はっく しちじゅうに'],
   ['くいちが く','くに じゅうはち','くさん にじゅうしち','くし さんじゅうろく','くご しじゅうご','くろく ごじゅうし','くしち ろくじゅうさん','くは しちじゅうに','くく はちじゅういち']];

  /* ---- まもの 216ぴき：12しゅるい × 3だんかい × 6しょく（0〜107が もとからの 6しゅるい、108〜215が せいようの かいぶつ）

  /* ---- プロフィール と フレンド ----
     フレンドコードは プロフィールの うつし（なまえ・Lv・きろく・みため）を もじに したもの。
     つうしんは しないので、あいての さいしんの きろくを みるには コードを もらいなおす。 */
  function cardOf(h){
    var l=lookOf(h),ti=-1;TITLES.forEach(function(t,i){if(t.n===h.prof.title)ti=i});
    return {name:h.name,lv:h.lv,best:h.rec.best,zukan:count(h.seen),items:count(h.items),title:ti,color:l.color,phrase:h.prof.phrase,fav:h.prof.fav==null?-1:h.prof.fav,mh:l.mh,mw:l.mw,ms:l.ms,skin:l.skin};
  }
  function b36(n,len){n=Math.max(0,Math.min(Math.pow(36,len)-1,Math.floor(n)));var t=n.toString(36);while(t.length<len)t='0'+t;return t}
  function sum36(t){var n=0;for(var i=0;i<t.length;i++)n+=t.charCodeAt(i)*(i+1);return b36(n%36,1)}
  function encode(c){
    var nm=Array.from(c.name).slice(0,6),t=b36(nm.length,1);
    nm.forEach(function(ch){var k=ch.codePointAt(0);t+=b36(k>46655?63:k,3)});
    t+=b36(c.lv,2)+b36(c.best,2)+b36(c.zukan,2)+b36(c.items,2)+b36(c.title+1,2)+b36(c.color,1)+b36(c.phrase,1)+b36(c.fav+1,2)+b36(c.mh,1)+b36(c.mw,1)+b36(c.ms,1)+b36(c.skin||0,1);
    t=(t+sum36(t)).toUpperCase();
    return t.match(/.{1,4}/g).join('-');
  }
  function decode(str){
    var t=String(str).toLowerCase().replace(/[^0-9a-z]/g,''),n=parseInt(t[0],36);
    if(!(n>=1&&n<=6)||(t.length!==1+3*n+18&&t.length!==1+3*n+19)||sum36(t.slice(0,-1))!==t.slice(-1))return null;
    var i=1,rd=function(len){var v=parseInt(t.substr(i,len),36);i+=len;return v},name='';
    for(var k=0;k<n;k++)name+=String.fromCodePoint(rd(3));
    var c={name:name,lv:rd(2),best:rd(2),zukan:rd(2),items:rd(2),title:rd(2)-1,color:rd(1),phrase:rd(1),fav:rd(2)-1,mh:rd(1),mw:rd(1),ms:rd(1)};
    c.skin=t.length===1+3*n+19?rd(1):0;
    if(c.lv<1||c.zukan>MON.length||c.items>100||c.title>=TITLES.length||c.color>=COLORS.length||c.phrase>=PHRASES.length||c.fav>=MON.length||c.skin>=SKINS.length||c.mh>5||c.mw>5||c.ms>5)return null;
    return c;
  }

    save.slots.forEach(function(h,i){if(h&&i!==slotNo){var c=cardOf(h);c.local=true;out.push(c)}});
    hero.friends.forEach(function(code,i){var c=decode(code);if(c){c.idx=i;out.push(c)}});
    return out;
  }

          steps.push({t:nm+'は めずらしい ふくを おとした！\nスキン「'+SKINS[sk].n+'」を てにいれた！',s:[784,988,1175,1568,0,1568],l:.08,pop:{head:'スキンを てにいれた！',icon:skinPic(sk),name:SKINS[sk].n,sub:'プロフィールで きがえられるよ'}});
        }
        if(join)steps.push({t:m.n+'が おきあがり、なかまに なった！',s:[659,784,988,784,1175],l:.09,fn:function(){hero.pals[m.id]=1;if(hero.pal==null)hero.pal=m.id;status()},pop:{head:'なかまが ふえた！',icon:sprite(m),name:esc(m.n),sub:'ぼうけんで 1ど、こうげきから かばってくれる'}});
        if(up)steps.push({t:'レベルが あがった！\n'+hero.name+'は Lv '+hero.lv+'に なった！ HPが かいふくした！',s:[523,523,523,659,784,0,1047],l:.1,fn:function(){G.heroHp=maxHp();status()},pop:{head:'レベルアップ！',icon:heroPic(),name:'Lv '+hero.lv,sub:'HPが ぜんぶ かいふくした！'}});
        G.enc++;G.kills++;
        if(G.mode==='endless'&&G.kills>hero.rec.best)hero.rec.best=G.kills;
        persist();
        seq(steps,function(){persist();if(G.list&&G.enc>=G.list.length)clearRun();else encounter()});
      }
    }else{
      if(btn)btn.classList.add('wrong');
      G.miss++;G.combo=0;G.retry.push(G.cur);G.missed[k]=1;
      hero.nig[k]=(hero.nig[k]||0)+2;
      var t='ざんねん！ '+a+' × '+b+' ＝ '+ans+' だよ。'+yomi+'\n'+mname()+'の こうげき！ ';
      box.classList.remove('is-hit','is-in','is-atk');void box.offsetWidth;if(!hero.cfg.practice)box.classList.add('is-atk');
      if(hero.cfg.practice){t+='れんしゅうモードなので ダメージは なし！';tune([330,262],.08)}
      else if(Math.random()*100<eqVal(1)){t+='しかし '+hero.name+'は たてで ふせいだ！';tune([440,660],.07);setTimeout(function(){fx('guard','ガード！')},220)}
      else if(hero.pal!=null&&!G.palUsed){G.palUsed=true;t+='なかまの '+MON[hero.pal].n+'が かばってくれた！';tune([440,554,660],.07);setTimeout(function(){fx('guard','かばった！')},220)}
      else{
        G.heroHp-=3;t+=hero.name+'は 3の ダメージを うけた！';setTimeout(function(){fx('hurt','−3');$('app').classList.remove('quake','critq');void $('app').offsetWidth;$('app').classList.add('quake');tune([147,110],.12)},220);
      }
      status();
      var n=$('next');
      if(G.heroHp<=0){
        G.over=true;status();bgm(null);persist();
        say(t+'\n'+hero.name+'は ちからつきた…');
        later(gameOver,1800);
        return;
      }
      say(t);n.textContent='▶ つぎへ';n.onclick=ask;
      persist();
      n.classList.add('show');n.focus();
    }
  }
  function gameOver(){
    var keys=Object.keys(G.missed);
    $('overPic').innerHTML=heroPic();
    $('overMsg').textContent=hero.name+'は ちからつきた…\n'+(G.mode==='endless'?'きろく：'+G.kills+'たい たおした！（さいこう '+hero.rec.best+'たい）':G.label+'で '+G.kills+'たい たおした')+'\nけいけんちや そうびは そのまま のこるよ。';
    $('overMiss').innerHTML=keys.length?'<div class="small">つぎは ここを おぼえて いこう</div><div class="miss">'+keys.map(function(k){var p=kv(k);return '<span>'+p[0]+'×'+p[1]+'='+(p[0]*p[1])+'</span>'}).join('')+'</div>':'';
    $('over').classList.add('show');
    tune([392,370,349,330,311,294,0,196,196],.2);
    $('overRetry').onclick=function(){$('over').classList.remove('show');stopTimers();checkTitles();persist();if(again)again();else leave()};
    $('overBack').onclick=leave;
    $('overRetry').focus();
  }
  function clearRun(){
    G.over=true;
    $('mon').innerHTML='';clearChoices();drawMhp();status();bgm(null);
    if(!G.miss)hero.rec.perfect++;
    if(G.mode==='maou'){hero.rec.maou++;persist();ending();return}
    var t;
    if(G.mode==='weak')t='しゅぎょうを やりとげた！\nにがてな 九九は のこり '+count(hero.nig)+'こ。';
    else{hero.cleared[G.id]=true;t=G.label+'を クリアした！'+(G.id<=9?'\n'+G.id+'のだんを マスターだ！':'')}
    persist();
    say(t+(G.miss?'':'\nしかも ぜんもん せいかい！'));
    tune([523,0,523,587,659,0,784,1047],.11);
    var n=$('next');n.textContent='▶ もどる';n.onclick=leave;n.classList.add('show');
  }
  function ending(){
    var fresh=checkTitles(),t=totals(hero);persist();
    tune([523,659,784,0,659,784,1047,0,784,1047,1319,1319],.14);
    page('おめでとう！','',
      '<div class="center" style="margin:8px 0">'+sprite(MAOU,'height:90px;opacity:.35')+'</div>'+
      '<div class="pre center">'+esc(hero.name)+'は まおうを たおした！\n\nダンジョンに へいわが もどった。\n九九の ちからで せかいを すくった\n'+esc(hero.name)+'は、\n九九の ゆうしゃと よばれるように なった。</div>'+
      '<div class="center gold" style="margin:14px 0">― おしまい ―</div>'+
      '<div class="small center">Lv '+hero.lv+'　こたえた かず '+(t[0]+t[1])+'もん\nずかん '+count(hero.seen)+'/'+MON.length+'　そうび '+count(hero.items)+'/100</div>'+
      '<div class="center" style="margin-top:12px">でも ぼうけんは つづく。\n「たつじんへのみち」で うでだめしだ！</div>',
      function(){drawFloors(fresh);show('floors');bgm('menu')});
    $('pgBody').classList.add('pre');
    $('pgBack').addEventListener('click',function(){$('pgBody').classList.remove('pre')},{once:true});
  }
  function leave(){$('pop').classList.remove('show');$('over').classList.remove('show');stopTimers();G.over=true;var fresh=checkTitles();persist();drawFloors(fresh);show('floors');bgm('menu')}
  $('run').onclick=leave;

  drawTitle();
})();
</script>
</body>
</html>
